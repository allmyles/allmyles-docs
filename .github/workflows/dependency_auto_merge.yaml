# claude-kit:dependency-auto-merge v1 — kit-managed file.
# Generated by setup-project.sh from the kit's caller-stub template (INF-403).
# DO NOT hand-edit — re-run setup-project.sh to refresh. An existing
# dependency_auto_merge.yaml WITHOUT this marker line is treated as a
# repo-specific fork and preserved (keep-out).
#
# What happens to a Dependabot pull request in this repo:
#   small (patch/minor) update  → approved, tested, merges itself into
#                                 master once every required check passes —
#                                 but only where a required check BUILDS the app
#                                 (kit_dependency_auto_merge.build_check in
#                                 .claude/develop-config.json; INF-413). Without
#                                 one it waits for a person;
#   major update                → tested, then waits for a person;
#   security fix opened against the default branch on a staging repo
#                               → waits for a person. It cannot be kept on
#                                 master: Dependabot moves its PRs back
#                                 to the default branch on every rebase, and an
#                                 armed PR would then merge there unpromoted;
#   branch with no test check   → waits for a person.
# The rules live in the kit's reusable workflow; this stub only switches them on.
name: Dependency update auto-merge

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

# CONCURRENCY (INF-325): decided in the reusable, not here.
# `dependency-auto-merge.yml` serialises per pull request with
# `cancel-in-progress: false`: a cancelled run could stop between moving a
# security fix to staging and approving it, or between approving and arming.
# A caller-level group would be a second, different group — do not add one.
jobs:
  dependency-update:
    # Dependabot's own same-repo PRs only. pull_request_target pins this file
    # to the base branch, so a PR cannot edit the guard away.
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    uses: allmyles/claude-kit/.github/workflows/dependency-auto-merge.yml@v1
    permissions:
      contents: read
      pull-requests: write
    with:
      pr_base_branch: "master"
      pipeline_event_type: ""
      build_check: ""
    secrets:
      GH_APP_ID: ${{ secrets.GH_APP_ID }}
      GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
