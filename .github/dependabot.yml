# claude-kit:dependabot v1 — kit-managed file (INF-403).
# Generated by claude-kit setup-project.sh from the ecosystems this repo
# contains; it is regenerated on every kit upgrade. Do not hand-edit — delete
# this first line to take ownership, and the kit will leave the file alone.
#
# Security fixes are NOT governed here: they come from the repository's
# "Dependabot security updates" setting and are proposed immediately.
# This file schedules the other updates: weekly, grouped per ecosystem, three
# days after release; majors get their own pull request and wait for a person.
version: 2
updates:
  - package-ecosystem: "pip"
    directories:
      - "/"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "06:00"
      timezone: "Europe/Budapest"
    cooldown:
      default-days: 3
    groups:
      pip-minor-and-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directories:
      - "/"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "06:00"
      timezone: "Europe/Budapest"
    cooldown:
      default-days: 3
    ignore:
      - dependency-name: "allmyles/claude-kit*"
    groups:
      github-actions-minor-and-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
