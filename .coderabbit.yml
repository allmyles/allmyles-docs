# claude-kit:coderabbit-config
# Managed by claude-kit — re-rendered by setup-project.sh. Hand edits are lost.
# To take ownership of this file, delete the marker line above; the kit then
# treats it as repo-specific and never touches it again.
#
# WHY THIS FILE IS SHIPPED BY THE KIT
#
# The single load-bearing setting is `request_changes_workflow` below. Without
# it, CodeRabbit never auto-approves after review comments are resolved, so a
# pull request whose comments are ALL resolved and whose checks are ALL green
# still sits blocked behind a standing "changes requested" that nothing lifts.
# That is not theoretical: three of five code repos had no config at all, and
# whitelabel-internal#764 sat blocked for over a day in exactly that state with
# 41 review threads resolved and every check green (INF-292).
#
# It ships from the kit rather than from each repo because a customer adopting
# claude-kit should get a working review loop without configuring anything.

# Merge with parent configuration levels instead of replacing them.
#
# This is what makes org-wide settings actually take effect. CodeRabbit does
# NOT merge config sources by default: a repository file is simply the
# highest-priority source, and every key it omits falls back to CodeRabbit's
# DEFAULTS — not to the organisation value. So without this line, shipping a
# repo file would SILENCE any org-level setting, which is the opposite of
# standardising.
#
# With inheritance on, the chain resolves org/workspace settings first and this
# file overrides only what it actually declares. Global overrides set by an
# admin still win over everything, by design. Verify a resolved config on any
# pull request with `@coderabbitai configuration`.
inheritance: true

reviews:
  # Does double duty per CodeRabbit's schema
  # (https://docs.coderabbit.ai/reference/configuration):
  #   1. CodeRabbit submits CHANGES_REQUESTED on findings, not just comments.
  #   2. CodeRabbit AUTO-APPROVES once every comment thread is resolved and no
  #      pre-merge checks are failing.
  # /develop Step 9b depends on (2): the merge-readiness loop resolves threads
  # (fix / defer-with-ticket / reject-with-rationale) and relies on the approval
  # that follows to clear the review and unblock the merge. Turning this off
  # strands every pull request the loop touches.
  request_changes_workflow: true

  high_level_summary: true
  review_status: true

  # Thorough review is the point — the loop is built to converge through it.
  profile: "assertive"

  auto_review:
    enabled: true
    # Rendered by setup-project.sh from develop-config.json `shape`:
    # staging-master repos review both branches, single-branch repos only their
    # default branch. A branch missing here gets NO review, so the required
    # CodeRabbit check never reports and the pull request blocks forever.
    base_branches:
      - "master"
